# Renders VPX's test table at an iPhone's screen size with several view settings, in software
# (Mesa), and commits the pictures to the phone-preview-shots branch, to compare views without a phone.
# The build comes from the run named below (its Linux x64 package).
name: phone-preview
on:
  push:
    branches: [phone-preview]
permissions:
  contents: write
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # the builds are uploaded as they are, not zipped (vpinball.yml: archive: false)
      - uses: actions/download-artifact@v8
        with:
          run-id: 41320338485
          github-token: ${{ github.token }}
          pattern: VPinballX_BGFX-*-linux-x64-Release.tar.gz
          path: dl
          skip-decompress: true
      - name: Unpack and install Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 libgles2 > /dev/null
          mkdir vpx
          find dl -name '*.tar.gz' -exec tar xzf {} -C vpx \;
          find dl -type f ! -name '*.tar.gz' | head
          ls -R vpx | head -30
      - name: Render
        run: |
          set -x
          bin=$(find "$PWD/vpx" -type f -name 'VPinballX_BGFX' | head -1)
          chmod +x "$bin"
          mkdir shots
          # an iPhone 15 Pro Max at half resolution: 645x1398 (6.7", 15.4 x 7.1 cm), the phone's view
          run() { # name, extra ini lines
            rm -rf work && mkdir work && cp -r src/assets/exampleTable.vpz work/table.vpz
            printf '[Player]\nPlayfieldFullScreen = 0\nPlayfieldWidth = 645\nPlayfieldHeight = 1398\nScreenWidth = 15.4\nScreenHeight = 7.1\nBGSet = 1\nCabinetAutofitMode = 1\nScreenPlayerZ = 40\n%b\n' "$2" > work/vpx.ini
            HOME=$PWD/home xvfb-run -a -s "-screen 0 700x1500x24" timeout 600 "$bin" -Ini "$PWD/work/vpx.ini" -CaptureAttract 1 30 "$PWD/work/table.vpz" noloop > "shots/$1.log" 2>&1 || true
            f=$(find work -name '*.qoi' | sort | head -1)
            [ -n "$f" ] && cp "$f" "shots/$1.qoi"
            tail -3 "shots/$1.log"
          }
          # the looks, as Renderer::ApplyLook sets them (tonemapper: 2 Filmic, 3 Neutral)
          look() { # name, tonemapper, exposure, saturation, contrast, light level (empty: the table's)
            light=""; [ -n "$6" ] && light="OverrideTableEmissionScale = 1\nEmissionScale = $6\n"
            run "$1" "${light}[TableOverride]\nToneMapper = $2\nExposure = $3\nSaturation = $4\nContrast = $5"
          }
          run 0-tables-own ''
          look 1-vivid 3 1.15 1.20 1.05 ''
          look 2-punchy 2 1.15 1.20 1.04 ''
          look 3-vivid-bright 3 1.30 1.25 1.08 0.65
          look 4-arcade 2 1.30 1.30 1.06 0.60
          look 5-daylight 3 1.45 1.20 1.10 0.80
          ls -la shots
      - name: Commit the pictures
        run: |
          cd shots
          git init -q -b phone-preview-shots
          git config user.name preview && git config user.email preview@localhost
          git add -A && git commit -q -m "phone preview $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" phone-preview-shots
